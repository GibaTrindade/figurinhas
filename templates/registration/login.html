{% extends 'base.html' %}

{% block title %}Entrar | Album Copa 2026{% endblock %}

{% block content %}
<section class="pt-2">
    <h1 class="h4 mb-1">Entrar</h1>
    <p class="text-muted mb-3">Acesse sua colecao de figurinhas.</p>

    <div class="card app-card">
        <div class="card-body">
            <form method="post" class="d-grid gap-3">
                {% csrf_token %}
                {% if form.non_field_errors %}
                    <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
                {% endif %}
                <div>
                    <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
                    <input class="form-control" type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" required autofocus>
                </div>
                <div>
                    <label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>
                    <input class="form-control" type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" required>
                </div>
                <button class="btn btn-primary btn-lg" type="submit">Entrar</button>
            </form>
        </div>
    </div>
    <a class="btn btn-link w-100 mt-3" href="{% url 'register' %}">Criar uma conta</a>
</section>
{% endblock %}
